spring:
  application:
    name: EventHub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

aws:
  s3:
    bucket-name: eventhub-storage-174302433598